schema-version = "1.19.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
python.pkg-path = "python311"         # confirm the name with: flox search python311
postgresql.pkg-path = "postgresql_16" # confirm with: flox search postgresql_16

[vars]
# Plain environment variables, set on every activation.
DB_HOST = "localhost"        # the app reads this instead of "postgresql-service"
PGHOST = "localhost"         # lets `psql` connect without extra flags
PGPORT = "5432"
PGUSER = "postgres"
PAGE_MESSAGE = "Hello from Flox"

[hook]
# Runs every time the environment activates.
on-activate = '''
  # 1. Postgres data lives in the environment's cache folder (not committed to git).
  export PGDATA="$FLOX_ENV_CACHE/pgdata"
  if [ ! -d "$PGDATA" ]; then
    echo "Creating a local Postgres database cluster..."
    initdb -U postgres --auth=trust -D "$PGDATA" > /dev/null
  fi

  # 2. Python packages go in a virtual environment inside the cache folder.
  export PYTHON_DIR="$FLOX_ENV_CACHE/python"
  if [ ! -d "$PYTHON_DIR" ]; then
    echo "Creating a Python virtual environment..."
    python -m venv "$PYTHON_DIR"
  fi
  (
    source "$PYTHON_DIR/bin/activate"
    pip install -r requirements.txt --quiet
  )
'''

[profile]
# Runs in your interactive shell, so `python` means the venv's Python.
bash = '''
  source "$PYTHON_DIR/bin/activate"
'''
zsh = '''
  source "$PYTHON_DIR/bin/activate"
'''

[services]
# Started by `flox activate -s` (or `flox services start`).
# unix_socket_directories= turns off socket files, which can fail on macOS
# when the project path is long; the app and psql use TCP on localhost.
postgres.command = 'exec postgres -D "$PGDATA" -p "$PGPORT" -c listen_addresses=localhost -c unix_socket_directories='

## Other Environment Options -----------------------------------------
[options]
# Systems that environment is compatible with
# systems = [
#   "aarch64-darwin",
#   "aarch64-linux",
#   "x86_64-darwin",
#   "x86_64-linux",
# ]
# Uncomment to disable CUDA detection.
# cuda-detection = false
