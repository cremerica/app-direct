  "manifest": {
    "schema-version": "1.19.0",
    "install": {
      "postgresql": {
        "pkg-path": "postgresql_16"
      },
      "python": {
        "pkg-path": "python311"
      }
    },
    "vars": {
      "DB_HOST": "localhost",
      "PAGE_MESSAGE": "Hello from Flox",
      "PGHOST": "localhost",
      "PGPORT": "5432",
      "PGUSER": "postgres"
    },
    "hook": {
      "on-activate": "  # 1. Postgres data lives in the environment's cache folder (not committed to git).\n  export PGDATA=\"$FLOX_ENV_CACHE/pgdata\"\n  if [ ! -d \"$PGDATA\" ]; then\n    echo \"Creating a local Postgres database cluster...\"\n    initdb -U postgres --auth=trust -D \"$PGDATA\" > /dev/null\n  fi\n\n  # 2. Python packages go in a virtual environment inside the cache folder.\n  export PYTHON_DIR=\"$FLOX_ENV_CACHE/python\"\n  if [ ! -d \"$PYTHON_DIR\" ]; then\n    echo \"Creating a Python virtual environment...\"\n    python -m venv \"$PYTHON_DIR\"\n  fi\n  (\n    source \"$PYTHON_DIR/bin/activate\"\n    pip install -r requirements.txt --quiet\n  )\n"
    },
    "profile": {
      "bash": "  source \"$PYTHON_DIR/bin/activate\"\n",
      "zsh": "  source \"$PYTHON_DIR/bin/activate\"\n"
    },
    "options": {},
    "services": {
      "postgres": {
        "command": "exec postgres -D \"$PGDATA\" -p \"$PGPORT\" -c listen_addresses=localhost -c unix_socket_directories="
      }
    }
  },
